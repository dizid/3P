# Netlify configuration for De 3 P's

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NPM_CONFIG_PRODUCTION = "false"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# Environment variable context
[context.production.environment]
  NODE_ENV = "production"

[context.deploy-preview.environment]
  NODE_ENV = "preview"

# SPA fallback: prerendered pages (e.g. /tools/pmi -> tools/pmi.html) are served first;
# app-only routes (/history, /shared/*, /auth/verify) and unknown URLs get the noindex shell
[[redirects]]
  from = "/*"
  to = "/app-shell.html"
  status = 200

# Long-lived cache for Vite's content-hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
